summary: >-
  Disco publishes no plans, no tiers and no rate card. There is nothing to sign up
  for and no price on any public page. Advertisers pay per outcome on a CPA/CPO or
  CPC basis with the rate set per advertiser during onboarding; publishers pay
  nothing and are paid out of the network. Every commercial path on the site ends at
  https://disconetwork.com/book-a-demo. plan_count is 0 because that is the true
  state, not because pricing was missed.
