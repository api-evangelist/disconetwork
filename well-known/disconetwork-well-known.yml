summary:
  hits: 0
  note: >-
    Nothing was found. Every /.well-known/* path on disconetwork.com and
    www.disconetwork.com answers HTTP 200 with the marketing site's SPA HTML shell
    (the same <!doctype html> body as the homepage, title "Disco: Commerce Media
    Network for Post-Purchase & Beyond"), not a document. That is a catch-all, not
    a served well-known surface, so NO WellKnown or SecurityTxt pointer is emitted.
    The API, docs, consumer and support hosts return honest 404s.
  stated_vs_deployed: >-
    Disco's own agent-facing material advertises three well-known documents that are
    not actually served. https://disconetwork.com/developers.md lists "API catalog
    (RFC 9727): /.well-known/api-catalog", "Agent skills:
    /.well-known/agent-skills/index.json" and "WebMCP:
    /.well-known/mcp/server-card.json", and the site's in-page WebMCP
    `get_developer_docs` tool returns the first two paths as if they resolve. All
    three return the SPA HTML shell. This is a real, fixable gap on the provider's
    side, not a probe failure on ours.
