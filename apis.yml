- aid: disconetwork-discobeat-channel-api
  name: DiscoBeat Channel API
  description: The channel-partner management API behind DiscoBeat. Lists ad categories
    and subcategories, reads channel details, manages channel-wide and publisher-specific
    subcategory exclusions, and lists, inspects, adds and removes the publishers in
    a channel. Documented with request/response examples and curl on disconetwork.com;
    no machine-readable specification is published for it.
  humanURL: https://disconetwork.com/developers/discobeat
  baseURL: https://api.disconetwork.com
  tags:
  - Channel Management
  - Publishers
  - Commerce Media
  properties:
  - type: APIReference
    url: https://disconetwork.com/developers/discobeat
  - type: Documentation
    url: https://disconetwork.com/developers
- aid: disconetwork-event-api
  name: Disco Event API
  description: The server-to-server conversion intake used by advertisers who cannot
    run the Web SDK. A POST carries an event name, the publisher account id and one
    of three customer identifiers (raw email, SHA-256 email hash, or the URL-appended
    click identifier) so Disco can attribute a conversion back to the impression that
    drove it.
  humanURL: https://docs.disconetwork.com/docs/advertiser-discofeed/track-conversions/event-api
  baseURL: https://consumer.disconetwork.com
  tags:
