- aid: disconetwork-partner-api
  name: Disco Partner Integration API
  description: The API used by Disco partners that provide their own UI experience.
    Returns Disco advertiser recommendations for post-purchase placements and accepts
    the widget, brand, product and element events (single and batched) that record
    user actions against those placements. Authenticated with an x-api-key header.
  humanURL: https://docs.disconetwork.com/docs/api-ref/external-api-for-disco-integration-partners
