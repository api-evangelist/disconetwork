name: Disconetwork
description: 'Disco (disconetwork.com, Disco Technology Inc.) is a commerce media network
  focused on the post-purchase moment. It helps ecommerce brands and platforms monetize
  order-confirmation, order-tracking, checkout, email and app surfaces by placing relevant
  partner offers in front of shoppers, and gives advertisers a performance channel to
  reach buyers at the point of purchase. Its product suite spans DiscoOffers (publisher
  monetization), DiscoBeat (a headless, white-labeled commerce media API for SaaS platforms),
  DiscoMix (non-endemic demand for retail media networks) and OffersAI (the ranking and
  personalization engine). Disco publishes a real developer surface: a partner-integration
  OpenAPI at docs.disconetwork.com, two versions of a Reporting API with downloadable
  OpenAPI 3.0.3 specs and Postman collections, a documented DiscoBeat Channel API, a
  JavaScript Web SDK, and an llms.txt. Backed by Felicis.'
