description: Disco (disconetwork.com) is a commerce media network focused on the post-purchase moment.
  It helps ecommerce brands monetize their order-confirmation and thank-you pages by placing relevant
  partner offers in front of shoppers, and gives advertisers a channel to reach buyers at the point of
  purchase. Its products span offer placement, audience insights, and cross-brand advertising across the
  post-purchase experience and beyond. Backed by Felicis. No public developer API surface was found at
  the time of enrichment.
