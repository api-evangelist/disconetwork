- aid: disconetwork-reporting-api
  name: Disco Reporting API
  description: Read-only channel analytics for DiscoBeat channel partners. V1 exposes
    a channel summary and a per-publisher breakdown with daily or hourly time series;
    V2 returns a flat, paginated report table driven by time grain, group-by breakdowns,
    metric selection and filters. Authenticated with a management API key in the x-api-key
    header; data is not live and is bounded by a published available_window.
  humanURL: https://disconetwork.com/reporting-api
  baseURL: https://api.disconetwork.com
  tags:
  - Reporting
  - Analytics
  - Commerce Media
  properties:
  - type: OpenAPI
    url: openapi/disconetwork-reporting-api-v1.yml
  - type: OpenAPI
    url: openapi/disconetwork-reporting-api-v2.yml
