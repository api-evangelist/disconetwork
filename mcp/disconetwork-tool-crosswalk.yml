summary: >-
  Disco's declared agent tool surface and Disco's actual API surface do not
  intersect at a single operation. All four WebMCP tools are marketing-site
  navigation with no REST backing; all six published OpenAPI operations have no
  tool. This is a total crosswalk miss, and recording it is the point — the
  provider ships an agent surface that cannot transact against the business.
