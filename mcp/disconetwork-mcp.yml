summary: 'Disco publishes NO hosted or remote MCP server. What it does ship is a real in-page WebMCP surface:
  the production site bundle registers four tools with `navigator.modelContext.provideContext({tools})`
  on load, so a browsing agent that supports WebMCP can call them. That is a genuine agent surface, verified
  verbatim in the shipped JavaScript, but it is NOT a connectable MCP endpoint — there is no transport,
  no URL an MCP client can address, and no server card. No `MCPServer` pointer is emitted in apis.yml
  for that reason.'
hosted_server:
  present: false
  probes:
