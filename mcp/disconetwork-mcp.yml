webmcp:
  present: true
  kind: in-page
  spec: WebMCP / navigator.modelContext
  registration: navigator.modelContext.provideContext({ tools })
  host: https://disconetwork.com
  evidence:
    file: https://disconetwork.com/assets/index-DdW-GXFA.js
    fetched: '2026-08-12'
    http_status: 200
    note: Tool array and the provideContext call were read verbatim out of the production bundle. The
      registration is wrapped in a try/catch and no-ops on a browser without `navigator.modelContext`.
  tool_count: 4
  tools:
  - name: navigate
    description: Navigate the Disco site to a known route. Use for sending the user to a specific page
      like the developer docs, a product page, or the demo booking form.
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Site path beginning with '/'.
      required:
      - path
    effect: client-side route change (history.pushState)
  - name: list_products
    description: List Disco's product suite with one-line descriptions and links.
    input_schema:
      type: object
      properties: {}
    effect: returns a static product list (DiscoOffers, DiscoBeat, DiscoMix, Offers AI)
  - name: book_demo
    description: Send the user to the Book a Demo page so they can request a meeting with the Disco sales
      team.
    input_schema:
      type: object
      properties: {}
    effect: client-side navigation to /book-a-demo
  - name: get_developer_docs
    description: Return links to Disco's developer documentation, including the DiscoBeat Channel API
      reference and integration paths (Shopify, Web SDK, server API).
    input_schema:
      type: object
      properties: {}
    effect: returns /developers, /developers/discobeat, /.well-known/api-catalog and /.well-known/agent-skills/index.json
    note: Two of the four links this tool returns do not resolve — /.well-known/api-catalog and /.well-known/agent-skills/index.json
      both answer with the SPA HTML shell. An agent following this tool's output is handed dead paths.
finding: Disco's WebMCP surface is entirely a marketing-site navigation layer. Not one of the four tools
  touches the four APIs Disco actually operates — recommendations, events, reporting or channel management.
  An agent that adopts Disco's declared MCP surface can browse the website and book a sales demo; it cannot
  read a report or record an event. See mcp/disconetwork-tool-crosswalk.yml for the operation-by-operation
  gap.
