  deprecated_operations: []
  detail: >-
    Disco publishes no deprecation policy, no sunset schedule, and no Deprecation or
    Sunset response headers. No operation in any of the three published OpenAPI files
    carries `deprecated: true`. The only forward-looking statement is a "What's Next"
    roadmap block on the DiscoBeat docs page that previews upcoming changes and says
    plainly that "dates aren't firm yet" and to ask your Disco contact — a courtesy
    heads-up, not a deprecation contract. Reporting V1's continued availability is
    asserted in prose with no end date attached.
