gaps:
- The Offer and Advertiser entities are the commercial core of the network and are
  not modeled in any published specification; they appear only as opaque ids inside
  event payloads.
- Publisher identity is spelled account_id (Event API), publisher_remote_id
  (DiscoBeat), publisher_uuid (Reporting V1) and publisher_id (Reporting V2). Nothing
  published states these are the same value.
- Exclusions carry three sources (channel, publisher, external) that are applied at
  runtime; the precedence order is described in prose only.
